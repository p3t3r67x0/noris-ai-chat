packages:
  - frontend

lockfile: true
optimisticRepeatInstall: false

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  unrs-resolver: true
  sharp: true
  vue-demi: true

overrides:
  enhanced-resolve: '5.24.5'
  vue-component-type-helpers: '3.3.11'
  '@eslint/config-inspector': '3.4.0'
  '@vue/compiler-core': '3.5.43'
  '@vue/compiler-dom': '3.5.43'
  '@vue/compiler-sfc': '3.5.43'
  '@vue/compiler-ssr': '3.5.43'
  '@vue/reactivity': '3.5.43'
  '@vue/runtime-core': '3.5.43'
  '@vue/runtime-dom': '3.5.43'
  '@vue/server-renderer': '3.5.43'
  '@vue/shared': '3.5.43'
