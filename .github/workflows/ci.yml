name: Foundation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: noris_migrator
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: noris_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U noris_migrator -d noris_ci_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NORIS_ENVIRONMENT: test
      NORIS_DATABASE_URL: postgresql+psycopg://noris_app:ci-only-app-password@127.0.0.1:5432/noris_ci_test
      NORIS_MIGRATION_DATABASE_URL: postgresql+psycopg://noris_migrator:ci-only-password@127.0.0.1:5432/noris_ci_test
      NORIS_TEST_DATABASE_URL: postgresql+psycopg://noris_migrator:ci-only-password@127.0.0.1:5432/noris_ci_test
      POSTGRES_USER: noris_migrator
      POSTGRES_DB: noris_ci_test
      NORIS_APP_DB_PASSWORD: ci-only-app-password
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGPASSWORD: ci-only-password
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.1.3
          make install
      - name: Lint and strict type checks
        run: |
          make lint
          make typecheck
      - name: Initialize application database
        run: |
          docker exec -i --env NORIS_APP_DB_PASSWORD="$NORIS_APP_DB_PASSWORD" \
            "${{ job.services.postgres.id }}" sh < infrastructure/docker/postgres-init.sh
          make migrate
      - name: Check API contract and unit tests
        run: |
          make check-api
          make test-unit
      - name: Database integration and migration checks
        env:
          NORIS_TEST_CADDY_BINARY: ${{ runner.temp }}/noris-test-caddy
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nginx
          docker pull caddy:2.10.2-alpine
          caddy_container=$(docker create caddy:2.10.2-alpine)
          docker cp "$caddy_container:/usr/bin/caddy" "$NORIS_TEST_CADDY_BINARY"
          docker rm "$caddy_container"
          make test-integration
          make migrate
      - name: Desktop and mobile browser tests
        run: |
          pnpm --dir frontend exec playwright install --with-deps chromium
          make test-e2e
          make test-e2e-websocket
      - name: Production builds
        run: make build
      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config --quiet
          # Syntax checks only: no SearXNG container or live engine request in CI.
          NORIS_SEARXNG_IMAGE=docker.io/searxng/searxng:latest \
          SEARXNG_SECRET=ci-only-search-secret-never-real \
          NORIS_SEARXNG_CONFIG_DIR=/tmp/noris-search-config \
            docker compose -f compose.searxng.yaml --profile search config --quiet
          NORIS_SEARXNG_CONFIG_VERSION=ci-fixture \
            docker compose --env-file .env.example -f compose.yaml -f compose.searxng-backend.yaml config --quiet
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The tool fixture rejects databases without this disposable suffix.
      POSTGRES_DB: noris_compose_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start a fresh Compose stack
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180
      - name: Verify same-origin routing, Python runtime and database permissions
        run: |
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/api/v1/health/ready
          docker compose exec -T -e NORIS_EXPECTED_PYTHON="$(cat .python-version)" backend python - <<'PY'
          import os
          import sys
          import psycopg
          expected_python = tuple(map(int, os.environ['NORIS_EXPECTED_PYTHON'].split('.')))
          assert sys.version_info[:2] == expected_python, sys.version
          url = os.environ['NORIS_DATABASE_URL'].replace('postgresql+psycopg:', 'postgresql:', 1)
          with psycopg.connect(url) as connection:
              row = connection.execute('SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user').fetchone()
              assert row == (False, False), row
          PY
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install production browser test dependencies
        run: |
          npm install --global pnpm@11.1.3
          pnpm install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Desktop and mobile browsers against Compose production
        run: make test-e2e-production
      - name: WebSocket browsers against Caddy and PostgreSQL with a local provider
        run: |
          docker compose -f compose.yaml -f compose.test.yaml up --build --wait --wait-timeout 180
          NORIS_E2E_COMPOSE_URL=http://127.0.0.1:8080 make test-e2e-websocket
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: production-browser-test-results
          path: |
            frontend/playwright-report/production
            frontend/test-results/production
            frontend/test-results/websocket
          if-no-files-found: ignore
          retention-days: 7
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable stack
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down
