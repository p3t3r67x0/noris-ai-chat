name: Approved privacy artifact cleanup
on:
  push:
    branches: [integration/privacy-artifact-cleanup]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete only the approved legacy PR20 browser artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: p3t3r67x0/noris-ai-chat
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          targets = [{"id":11600996282,"run":37897054297,"head":"276777109654c78f1fd8f32e0145db811b68d5f1"},{"id":11600882094,"run":37897048367,"head":"276777109654c78f1fd8f32e0145db811b68d5f1"},{"id":11601342578,"run":37897858356,"head":"19fec37d28486c15171687d015145b0c26621408"}]
          repo = os.environ['GH_REPO']
          # Check the complete allowlist before any deletion.
          present = []
          for target in targets:
              result = subprocess.run(['gh', 'api', f"repos/{repo}/actions/artifacts/{target['id']}"], capture_output=True, text=True)
              if result.returncode:
                  if 'HTTP 404' in result.stderr:
                      print(f"Already absent: {target['id']}")
                      continue
                  raise RuntimeError(f"Cannot inspect artifact {target['id']}")
              artifact = json.loads(result.stdout)
              run = artifact['workflow_run']
              assert artifact['id'] == target['id']
              assert artifact['name'] == 'browser-test-results'
              assert run['id'] == target['run']
              assert run['head_sha'] == target['head']
              present.append(target)
          for target in present:
              subprocess.run(['gh', 'api', '--method', 'DELETE', f"repos/{repo}/actions/artifacts/{target['id']}"], check=True)
              result = subprocess.run(['gh', 'api', f"repos/{repo}/actions/artifacts/{target['id']}"], capture_output=True, text=True)
              assert result.returncode != 0 and 'HTTP 404' in result.stderr, f"Deletion not confirmed: {target['id']}"
              print(f"Deleted and confirmed: {target['id']}")
          print(f"PASS: {len(present)} deleted; {len(targets) - len(present)} already absent")
          PY
