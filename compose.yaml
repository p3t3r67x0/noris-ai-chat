name: noris-ai-chat

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noris_dev}
      POSTGRES_USER: ${POSTGRES_USER:-noris_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
      NORIS_APP_DB_PASSWORD: ${NORIS_APP_DB_PASSWORD:?Set a local application database password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-noris-roles.sh:ro
    healthcheck:
      # The initialization server accepts Unix sockets before TCP is available.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: production
      network: ${NORIS_BUILD_NETWORK:-default}
    environment:
      NORIS_ENVIRONMENT: ${NORIS_ENVIRONMENT:-development}
      NORIS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-noris_migrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noris_dev}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: production
      network: ${NORIS_BUILD_NETWORK:-default}
    environment:
      NORIS_ENVIRONMENT: ${NORIS_ENVIRONMENT:-development}
      NORIS_DATABASE_URL: postgresql+psycopg://noris_app:${NORIS_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-noris_dev}
      NORIS_READINESS_TIMEOUT_SECONDS: ${NORIS_READINESS_TIMEOUT_SECONDS:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      target: production
      network: ${NORIS_BUILD_NETWORK:-default}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:${NORIS_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  default:
    driver: bridge
    driver_opts:
      # A stable Linux interface name allows a narrowly scoped persistent rule.
      com.docker.network.bridge.name: noris-chat0

volumes:
  postgres_data:
