# Explicit CI/local test override. Uses only synthetic credentials and loopback
# provider traffic. Never use this override for a public deployment.
services:
  backend:
    environment:
      NORIS_ENVIRONMENT: test
      NORIS_LLM_PROVIDER: openai-compatible
      NORIS_LLM_BASE_URL: http://127.0.0.1:8591/v1
      NORIS_LLM_ALLOWED_HOSTS: '["127.0.0.1"]'
      NORIS_LLM_API_KEY: fixture-provider-key-never-real
      NORIS_LLM_ACCESS_USERNAME: fixture-user
      NORIS_LLM_ACCESS_PASSWORD: fixture-application-password-never-real
      NORIS_LLM_ALLOWED_ORIGINS: '["http://127.0.0.1:8080"]'
      NORIS_LLM_MODELS: '[{"id":"fixture-alpha","name":"Fixture Alpha","category":"CHAT","token_limit_parameter":"max_tokens","sources":["fixture:local"],"evidence":{"category":"VERIFIED","streaming":"VERIFIED","token_limit_parameter":"VERIFIED"}},{"id":"fixture-beta","name":"Fixture Beta","category":"CHAT","token_limit_parameter":"max_tokens","sources":["fixture:local"],"evidence":{"category":"VERIFIED","streaming":"VERIFIED","token_limit_parameter":"VERIFIED"}},{"id":"fixture-long","name":"Fixture Long","category":"CHAT","context_window":131072,"provider_context_window":131072,"max_output_tokens":32768,"provider_max_output_tokens":32768,"provider_limit_evidence":"Local simulator only","token_limit_parameter":"max_tokens","sources":["fixture:local"],"evidence":{"category":"VERIFIED","streaming":"VERIFIED","token_limit_parameter":"VERIFIED"}}]'
      NORIS_LLM_DEFAULT_MODEL: fixture-alpha
      NORIS_LLM_MAX_OUTPUT_TOKENS: '32768'
      NORIS_LLM_REQUESTS_PER_MINUTE: '120'
      NORIS_LLM_DAILY_TOKEN_BUDGET: '10000000'
  frontend:
    environment:
      NUXT_PUBLIC_CHAT_TRANSPORT: websocket
  fixture:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      target: development
      network: ${NORIS_BUILD_NETWORK:-default}
    network_mode: service:backend
    environment:
      NORIS_ENVIRONMENT: test
      NORIS_LLM_PROVIDER: disabled
      NORIS_LLM_MODELS: '[]'
    command: ["uvicorn", "tests.fixtures.llm_http_server:app", "--host", "127.0.0.1", "--port", "8591"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8591/fixture/state', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
