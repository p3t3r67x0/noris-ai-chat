[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "noris-ai-backend"
version = "0.1.0"
description = "noris AI modular backend — foundation stage"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.0",
  "httpx[http2]==0.28.1",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-ai-slim==2.54.0",
  "pydantic-settings==2.15.0",
  "pypdf==6.20.0",
  "sqlalchemy[asyncio]==2.1.4",
  "tokenizers==0.23.3",
  "uvicorn==0.54.0",
  "websockets==17.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/noris_ai"]

[tool.hatch.build.targets.sdist]
# An absolute parent .gitignore entry does not exclude .local from a backend-root build.
# Package only source inputs; uploads and local provider configuration never belong here.
only-include = ["src/noris_ai", "migrations", "scripts", "tests", "alembic.ini", "pyproject.toml", "uv.lock"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "migrations", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]

[tool.uv]
# Server deployments and host development use CPython on Linux/macOS/Windows.
environments = ["sys_platform != 'emscripten'"]
