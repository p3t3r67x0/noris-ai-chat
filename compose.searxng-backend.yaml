# Explicit future connection overlay; compose.yaml is unchanged.
# The standalone search stack must have created this external network first.
services:
  backend:
    networks: [default, search]
    environment:
      NORIS_SEARXNG_BASE_URL: http://searxng:8080
      NORIS_SEARXNG_ALLOWED_HOSTS: '["searxng"]'
      # Private DNS targets require exact reviewed service IPs. No subnet grants.
      NORIS_SEARXNG_ALLOWED_ADDRESSES: ${NORIS_SEARXNG_ALLOWED_ADDRESSES:-[]}
      NORIS_SEARXNG_ENABLED: ${NORIS_SEARXNG_ENABLED:-false}
      NORIS_SEARXNG_CONFIG_VERSION: ${NORIS_SEARXNG_CONFIG_VERSION:?Set the reviewed configuration version}

networks:
  search:
    name: ${NORIS_SEARXNG_NETWORK:-noris-searxng}
    external: true
